name: Reusable GoReleaser CI workflow

on:
  workflow_call:
    inputs:
      distribution:
        required: true
        type: string
      goos:
        required: true
        type: string
      goarch:
        required: true
        type: string
    secrets:
      GORELEASER_KEY:
        required: false
      DEPLOY_KEY_PRIVATE_FOR_AXO_ETW:
        required: false

permissions:
  contents: read

env:
  # renovate: datasource=github-releases packageName=goreleaser/goreleaser-pro
  GORELEASER_PRO_VERSION: v2.20.3
  GONOSUMDB: github.com/axoflow/*
  GOPRIVATE: github.com/axoflow/*
  # read as ${INPUTS_DISTRIBUTION} in run: scripts, never interpolated into them
  INPUTS_DISTRIBUTION: ${{ inputs.distribution }}

jobs:
  check-goreleaser:
    strategy:
      matrix:
        GOOS: ${{ fromJSON( inputs.goos) }}
        GOARCH: ${{ fromJSON( inputs.goarch) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Setup wixl # Required to build MSI packages for Windows
        if: matrix.GOOS == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y wixl

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "~1.27.0"
          check-latest: true

      - name: Run version update script
        shell: bash
        run: ./scripts/pre-update-version.sh --snapshot

      - name: Setup private module access
        env:
          DEPLOY_KEY_PRIVATE_FOR_AXO_ETW: ${{ secrets.DEPLOY_KEY_PRIVATE_FOR_AXO_ETW }}
        run: ./scripts/prepare-private-modules-gha.sh

      - name: Generate sources for ${{ inputs.distribution }}
        env:
          DISTRIBUTIONS: ${{ inputs.distribution }}
        run: make generate-sources # inherits SSH_AUTH_SOCK from the previous step via $GITHUB_ENV

      - name: Run GoReleaser for ${{ inputs.distribution }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_PRO_VERSION }}
          workdir: distributions/${{ inputs.distribution }}
          args: --snapshot --clean --skip=sign,sbom --timeout 2h --split
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          GOARM: "7" # Default is 6
          GOAMD64: v1
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Print built artifacts
        run: cat ./distributions/${INPUTS_DISTRIBUTION}/dist/**/artifacts.json

      - name: Print metadata
        run: cat ./distributions/${INPUTS_DISTRIBUTION}/dist/**/metadata.json

      - name: Print dist folder contents
        run: ls -laR ./distributions/${INPUTS_DISTRIBUTION}/dist

      - name: Smoke test container image
        if: ${{ matrix.GOOS == 'linux' && matrix.GOARCH == 'amd64' }}
        run: |
          docker run --name ${INPUTS_DISTRIBUTION} \
            -d \
            -v ${PWD}/tests/docker-tests/default-config.yaml:/config.yaml \
            ghcr.io/axoflow/${INPUTS_DISTRIBUTION}/${INPUTS_DISTRIBUTION}:latest-amd64 \
            --config /config.yaml
          sleep 10
          docker logs ${INPUTS_DISTRIBUTION} &>docker-logs-${INPUTS_DISTRIBUTION}.log
          if grep "Everything is ready." docker-logs-${INPUTS_DISTRIBUTION}.log; then
            echo "${INPUTS_DISTRIBUTION} started up correctly"
          else
            echo "${INPUTS_DISTRIBUTION} failed to start"
            cat docker-logs-${INPUTS_DISTRIBUTION}.log
            exit 1
          fi
          docker rm -f ${INPUTS_DISTRIBUTION}

      - name: Run golden test
        if: ${{ matrix.GOOS == 'linux' && matrix.GOARCH == 'amd64' }}
        run: make golden-test IMG=ghcr.io/axoflow/${INPUTS_DISTRIBUTION}/${INPUTS_DISTRIBUTION}:latest-amd64

      - name: Upload linux service packages
        if: ${{ matrix.GOOS == 'linux' && matrix.GOARCH == 'amd64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: distributions/${{ inputs.distribution }}/dist/linux_amd64_v1/*
          if-no-files-found: error

      - name: Upload MSI packages
        if: ${{ matrix.GOOS == 'windows' && matrix.GOARCH == 'amd64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-packages
          path: distributions/${{ inputs.distribution }}/dist/windows_amd64_v1/**/*.msi
          if-no-files-found: error

      - if: always()
        run: ./.github/workflows/scripts/check-disk-space.sh
