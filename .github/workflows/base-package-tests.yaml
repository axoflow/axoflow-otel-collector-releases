name: Package Tests

on:
  workflow_call:
    inputs:
      type:
        required: true
        type: string
      distribution:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package-tests:
    name: Package Tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        type: ${{ fromJSON(inputs.type) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages

      - name: Test ${{ matrix.type }} package
        env:
          MATRIX_TYPE: ${{ matrix.type }}
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}
        run: ./scripts/package-tests/package-tests.sh ./axoflow-otel-collector*-SNAPSHOT-*_linux_amd64.${MATRIX_TYPE} ${INPUTS_DISTRIBUTION}

      - name: Test ${{ matrix.type }} package installation during Docker image build
        env:
          MATRIX_TYPE: ${{ matrix.type }}
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}
        run: ./scripts/package-tests/docker-build-test.sh ./axoflow-otel-collector*-SNAPSHOT-*_linux_amd64.${MATRIX_TYPE} ${INPUTS_DISTRIBUTION}
