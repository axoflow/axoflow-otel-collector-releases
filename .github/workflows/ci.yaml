name: CI - Collector Binaries

on:
  merge_group:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

env:
  GONOSUMDB: github.com/axoflow/*
  GOPRIVATE: github.com/axoflow/*

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "~1.27.0"
          check-latest: true

      - name: Tidy go.mod files
        run: go mod tidy

      - name: Setup private module access
        env:
          DEPLOY_KEY_PRIVATE_FOR_AXO_ETW: ${{ secrets.DEPLOY_KEY_PRIVATE_FOR_AXO_ETW}}
        run: ./scripts/prepare-private-modules-gha.sh

      - name: Verify
        run: make ci
