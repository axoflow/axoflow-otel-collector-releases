name: Reusable release workflow

on:
  workflow_call:
    inputs:
      distribution:
        required: true
        type: string
      goos:
        required: true
        type: string
      goarch:
        required: true
        type: string
    secrets:
      GORELEASER_KEY:
        required: true
      DEPLOY_KEY_PRIVATE_FOR_AXO_ETW:
        required: true
      WIF_PROVIDER:
        required: true
      EV_WIF_SERVICE_ACCOUNT:
        required: true
      EV_GCP_PROJECT_ID:
        required: true
      EV_GCP_KEY_RING:
        required: true
      EV_GCP_KEY_NAME:
        required: true
      EV_CERTIFICATE_CRT:
        required: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases packageName=goreleaser/goreleaser-pro
  GORELEASER_PRO_VERSION: v2.20.3
  GONOSUMDB: github.com/axoflow/*
  GOPRIVATE: github.com/axoflow/*

jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        GOOS: ${{ fromJSON(inputs.goos) }}
        GOARCH: ${{ fromJSON(inputs.goarch) }}
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: ./.github/workflows/scripts/free-disk-space.sh

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Setup wixl # Required to build MSI packages for Windows
        if: matrix.GOOS == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y wixl

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0 # zizmor: ignore[cache-poisoning] Go caches are content-addressed and dependencies are verified by go.sum
        with:
          go-version: "~1.27.0"
          check-latest: true

      - name: Run version update script
        shell: bash
        run: ./scripts/pre-update-version.sh "$GITHUB_REF_NAME"

      - name: Setup private module access
        env:
          DEPLOY_KEY_PRIVATE_FOR_AXO_ETW: ${{ secrets.DEPLOY_KEY_PRIVATE_FOR_AXO_ETW }}
        run: ./scripts/prepare-private-modules-gha.sh

      - name: Generate sources for ${{ inputs.distribution }}
        env:
          DISTRIBUTIONS: ${{ inputs.distribution }}
        run: make generate-sources # inherits SSH_AUTH_SOCK from the previous step via $GITHUB_ENV

      - name: Login to GitHub Package Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_PRO_VERSION }}
          workdir: distributions/${{ inputs.distribution }}
          args: release --clean --split --timeout 2h
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          GOARM: 7 # Default is 6
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_YES: true
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ inputs.distribution }}-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          path: distributions/${{ inputs.distribution }}/dist/**/*
          if-no-files-found: error

      - if: always()
        run: ./.github/workflows/scripts/check-disk-space.sh

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: prepare

    permissions:
      id-token: write
      packages: write
      contents: write
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: "v2.6.1"

      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0 # zizmor: ignore[cache-poisoning] Go caches are content-addressed and dependencies are verified by go.sum
        with:
          go-version: "~1.27.0"
          check-latest: true

      - name: Google auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: "${{ secrets.WIF_PROVIDER }}"
          service_account: "${{ secrets.EV_WIF_SERVICE_ACCOUNT }}"
          token_format: "access_token"

      - name: Build Axoflow-signer
        shell: bash
        run: ./signer-image/build-signer.sh "$GITHUB_REF_NAME"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-${{ inputs.distribution }}-windows-*
          path: distributions/${{ inputs.distribution }}/dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-${{ inputs.distribution }}-linux-*
          path: distributions/${{ inputs.distribution }}/dist
          merge-multiple: true

      - name: Login to GitHub Package Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Google Cloud KMS for Windows MSI code signing
        shell: bash
        env:
          EV_GCP_PROJECT_ID: ${{ secrets.EV_GCP_PROJECT_ID }}
          EV_GCP_KEY_RING: ${{ secrets.EV_GCP_KEY_RING }}
          EV_GCP_KEY_NAME: ${{ secrets.EV_GCP_KEY_NAME }}
          EV_CERTIFICATE_CRT: ${{ secrets.EV_CERTIFICATE_CRT }}
        run: |
          cat > /tmp/kmsp11-config.yaml << EOF
          ---
          tokens:
            - key_ring: "projects/${EV_GCP_PROJECT_ID}/locations/global/keyRings/${EV_GCP_KEY_RING}"
          EOF
          chmod 600 /tmp/kmsp11-config.yaml

          echo "${EV_CERTIFICATE_CRT}" | base64 -d > /tmp/certificate.crt

          echo "KMS_PKCS11_CONFIG=/tmp/kmsp11-config.yaml" >> $GITHUB_ENV
          echo "CERTIFICATE_CRT_PATH=/tmp/certificate.crt" >> $GITHUB_ENV
          echo "GCP_KEY_NAME=${EV_GCP_KEY_NAME}" >> $GITHUB_ENV

      - name: Sign Windows MSI installers
        shell: bash
        run: ./scripts/ev-sign.sh "$GITHUB_REF_NAME"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_PRO_VERSION }}
          workdir: distributions/${{ inputs.distribution }}
          args: continue --merge --timeout 2h
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_YES: true
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ inputs.distribution }}
          path: distributions/${{ inputs.distribution }}/dist/**/*
          if-no-files-found: error

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@97e0b3872f55f89b95b2f65b3dbab56962816478 # 0.34.2
        with:
          image-ref: ghcr.io/axoflow/axoflow-otel-collector/axoflow-otel-collector:latest
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "[${{ github.job }}] Trivy scan results"
          path: trivy-results.sarif
          retention-days: 5

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results.sarif

      - if: always()
        run: ./.github/workflows/scripts/check-disk-space.sh
